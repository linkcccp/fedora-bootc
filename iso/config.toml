# 交互式 Anaconda 安装器配置。
# 这里不写 clearpart/autopart/reboot，Anaconda 会停在交互界面，由用户选择磁盘、
# 分区并在安装时创建用户。bootc-image-builder 仍会自动注入安装本镜像所需的命令。
#
# %post 把安装后系统的更新源指向公开镜像标签，避免系统继续跟踪 ISO 内的本地镜像。
[customizations.installer.kickstart]
contents = """
graphical

%post --erroronfail
bootc switch --mutate-in-place --transport registry ghcr.io/linkcccp/fedora-bootc:latest
%end
"""
